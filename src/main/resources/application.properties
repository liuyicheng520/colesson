# 服务端口
# 默认使用 8082，避免本机已有 8080/8081 服务时启动失败。
# 如需覆盖，可在启动时传入：--server.port=8080
server.port=${SERVER_PORT:8082}

# 本地私有配置。用于 IDEA 直接运行时读取数据库密码等敏感项，不进入正式配置。
spring.config.import=optional:file:./config/application-local.properties

# API 鉴权与签名（封装默认关闭签名，按需通过环境变量开启）
ai.api.signature-required=${AI_API_SIGNATURE_REQUIRED:false}
ai.api.static-key=${AI_API_STATIC_KEY:}

# 火山方舟 / 兼容 OpenAI Chat Completions 的 AI 服务配置。
# 主讲稿与问答通道读取 AI_API_KEY / AI_API_URL / AI_MODEL_ENDPOINT。
# 部署时请通过服务器环境变量配置，不要把密钥写入仓库。

# PPT 图片多模态识别。默认开启，若模型不支持图片会自动跳过，不影响原解析。
# 如需使用专用视觉模型，可通过 AI_VISION_MODEL_ENDPOINT / AI_VISION_API_KEY 覆盖。
ai.vision.enabled=${AI_VISION_ENABLED:true}
ai.vision.api-url=${AI_VISION_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
ai.vision.api-key=${AI_VISION_API_KEY:}
ai.vision.model=${AI_VISION_MODEL_ENDPOINT:}
ai.vision.max-slides=${AI_VISION_MAX_SLIDES:6}
ai.vision.max-image-bytes=${AI_VISION_MAX_IMAGE_BYTES:5242880}

# 数字人模式: local | cloud | auto
ai.digital.mode=${AI_DIGITAL_MODE:auto}
ai.digital.cloud.enabled=${AI_DIGITAL_CLOUD_ENABLED:false}
ai.digital.cloud.url=${AI_DIGITAL_CLOUD_URL:https://visual.volcengineapi.com}
ai.digital.cloud.api-key=${AI_DIGITAL_CLOUD_API_KEY:}
ai.digital.cloud.auth-header=Authorization
ai.digital.cloud.auth-prefix=Bearer
ai.digital.cloud.timeout-ms=${AI_DIGITAL_CLOUD_TIMEOUT_MS:15000}
ai.digital.cloud.req-key=realman_avatar_creation_task
ai.digital.cloud.resource-id=${AI_DIGITAL_CLOUD_RESOURCE_ID:}
ai.digital.cloud.poll-attempts=${AI_DIGITAL_CLOUD_POLL_ATTEMPTS:6}
ai.digital.cloud.poll-interval-ms=${AI_DIGITAL_CLOUD_POLL_INTERVAL_MS:2000}
ai.digital.cloud.default-audio-url=${AI_DIGITAL_CLOUD_DEFAULT_AUDIO_URL:https://paddlespeech.cdn.bcebos.com/PaddleAudio/zh.wav}
ai.digital.cloud.ak=${AI_DIGITAL_CLOUD_AK:}
ai.digital.cloud.sk=${AI_DIGITAL_CLOUD_SK:}
ai.digital.cloud.region=${AI_DIGITAL_CLOUD_REGION:cn-north-1}
ai.digital.cloud.service=${AI_DIGITAL_CLOUD_SERVICE:cv}

# 运行时生成的音频与本地数字人页面。部署时不要写入 classpath，统一放在可写数据目录。
app.generated-static-dir=${APP_GENERATED_STATIC_DIR:data/generated-static}

# 上传限制
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# 日志级别（封装默认 INFO）
logging.level.org.springframework.web=INFO
logging.level.com.contest=INFO

# CORS 配置
# 生产环境建议通过 APP_CORS_ALLOWED_ORIGINS 指定正式域名，多个来源用英文逗号分隔。
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082,http://127.0.0.1:8082,http://localhost:18082,http://127.0.0.1:18082,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:*}

# 认证存储
auth.store-file=data/auth-users.json
auth.session-store-file=data/auth-sessions.json
auth.session-hours=12
auth.admin-usernames=${AUTH_ADMIN_USERNAMES:}
project.store-file=data/projects.json

# 存储模式：mysql | file
# 默认使用新建数据库 zhike_gongsheng；MySQL 不可用时服务会回退到原 JSON 文件。
app.storage=${APP_STORAGE:mysql}
app.mysql.url=${APP_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/zhike_gongsheng?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
app.mysql.username=${APP_MYSQL_USERNAME:root}
app.mysql.password=${APP_MYSQL_PASSWORD:}

# MySQL 连接池配置
app.mysql.pool.maximum-pool-size=${APP_MYSQL_POOL_MAXIMUM_POOL_SIZE:10}
app.mysql.pool.minimum-idle=${APP_MYSQL_POOL_MINIMUM_IDLE:1}
app.mysql.pool.connection-timeout-ms=${APP_MYSQL_POOL_CONNECTION_TIMEOUT_MS:5000}
app.mysql.pool.idle-timeout-ms=${APP_MYSQL_POOL_IDLE_TIMEOUT_MS:600000}
app.mysql.pool.max-lifetime-ms=${APP_MYSQL_POOL_MAX_LIFETIME_MS:1800000}

# 计算机课程知识库。目录文件只做幂等新增/更新，不删除已有知识文档或评测记录。
knowledge.catalog-file=${KNOWLEDGE_CATALOG_FILE:data/knowledge/catalog.json}
knowledge.auto-import=${KNOWLEDGE_AUTO_IMPORT:false}

# 计算机课程实验判题
code.judge.execution-enabled=${CODE_JUDGE_EXECUTION_ENABLED:true}
code.judge.use-macos-sandbox=${CODE_JUDGE_USE_MACOS_SANDBOX:true}

# 智学体同域反代：浏览器只访问 8082，内部 FastAPI 默认 127.0.0.1:8000
zhixueti.proxy-enabled=${ZHIXUETI_PROXY_ENABLED:true}
zhixueti.auth-bridge-enabled=${ZHIXUETI_AUTH_BRIDGE_ENABLED:true}
zhixueti.backend-base=${ZHIXUETI_BACKEND_BASE:http://127.0.0.1:8000}
# 启动宿主时自动拉起学生端后端（相对目录 zhixueti-backend）
zhixueti.auto-start=${ZHIXUETI_AUTO_START:true}
zhixueti.backend-dir=${ZHIXUETI_BACKEND_DIR:zhixueti-backend}
zhixueti.python-exe=${ZHIXUETI_PYTHON_EXE:}
zhixueti.cors-origins=${ZHIXUETI_CORS_ORIGINS:http://localhost:8082,http://127.0.0.1:8082}


# 宿主与学生端桥接共享密钥（须与 zhixueti-backend/.env 的 HOST_BRIDGE_SECRET 一致）
zhixueti.bridge-secret=${ZHIXUETI_BRIDGE_SECRET:}
