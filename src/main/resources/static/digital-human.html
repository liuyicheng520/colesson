<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI数字人讲课</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #203050;
      padding: 24px;
    }

    main {
      width: min(520px, 100%);
      background: #fff;
      border: 1px solid #e1e7f2;
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(32, 48, 80, 0.08);
      padding: 28px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.4;
      margin-bottom: 12px;
      color: #173b75;
    }

    p {
      line-height: 1.8;
      color: #5b6a86;
      margin-bottom: 18px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>请从工作台生成数字人讲课页</h1>
    <p>数字人页面会随当前讲稿生成专属链接，避免旧音频或旧讲稿被浏览器缓存后混用。</p>
    <a href="/workspace.html">返回工作台</a>
  </main>
</body>
</html>
