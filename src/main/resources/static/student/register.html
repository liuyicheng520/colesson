<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>学生账号开通</title>
  <link rel="stylesheet" href="/auth-pages.css?v=20260919w" />
  <link rel="stylesheet" href="/auth-hero.css?v=20260919w" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="hero-panel">
      <div>
        <div class="hero-deco" aria-hidden="true">
          <i class="hero-orb orb-a"></i>
          <i class="hero-orb orb-b"></i>
          <i class="hero-orb orb-c"></i>
          <i class="hero-dots"></i>
          <i class="hero-glow"></i>
        </div>
        <div class="hero-header">
          <div class="hero-brand">
            <div class="hero-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
                <path d="M5 6.5A2.5 2.5 0 0 1 7.5 4H19v15H7.5A2.5 2.5 0 0 0 5 21V6.5Z"/>
                <path d="M9 9h6"/>
              </svg>
            </div>
            <div class="hero-brand-copy">
              <strong>智课共生</strong>
            </div>
          </div>
          <div class="hero-status">学生开通</div>
        </div>

        <div class="hero-copy">
          <h1 aria-label="开通智课共生，学生身份。">
            <span class="line" aria-hidden="true"><span class="ch">开</span><span class="ch">通</span><span class="ch">智</span><span class="ch">课</span><span class="ch">共</span><span class="ch">生</span><span class="ch">，</span></span>
            <span class="line grad" style="--n:5" aria-hidden="true"><span class="ch gc" style="--i:0">学</span><span class="ch gc" style="--i:1">生</span><span class="ch gc" style="--i:2">身</span><span class="ch gc" style="--i:3">份</span><span class="ch gc" style="--i:4">。</span></span>
          </h1>
          <p>学生身份开通入口，填写后进入智课共生学生主页。</p>
          <div class="hero-stats" aria-label="学生开通概览">
            <div class="stat"><strong>学习</strong><span>课程与进度</span></div>
            <i class="divider" aria-hidden="true"></i>
            <div class="stat"><strong>问答</strong><span>AI 即时答疑</span></div>
            <i class="divider" aria-hidden="true"></i>
            <div class="stat"><strong>直达</strong><span>开通后进入</span></div>
          </div>
        </div>
      </div>

      <div class="hero-meta">
        <div class="hero-list">
          <div class="hero-item">
            <div class="hero-item-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4H19v15H7.5A2.5 2.5 0 0 0 5 21V6.5Z"/></svg>
            </div>
            <div>
              <strong>学生身份</strong>
              <span>开通后进入学生侧空间。</span>
            </div>
          </div>
          <div class="hero-item">
            <div class="hero-item-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 12h16"/><path d="m13 5 7 7-7 7"/></svg>
            </div>
            <div>
              <strong>即时进入</strong>
              <span>开通成功后自动进入学生主页。</span>
            </div>
          </div>
          <div class="hero-item">
            <div class="hero-item-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M8 10h8"/><path d="M8 14h5"/><path d="M12 3a7 7 0 0 1 0 14"/></svg>
            </div>
            <div>
              <strong>进度保留</strong>
              <span>学习记录与问答会留在这个账号。</span>
            </div>
          </div>
        </div>
        <div class="hero-foot">© 2026 智课共生 · AI 互动智课生成与实时问答系统</div>
      </div>
    </section>

    <section class="panel-zone">
      <div class="panel-toolbar">
        <a class="toolbar-link" href="#" data-lang="zh">中文</a>
        <a class="toolbar-link" href="#" data-lang="en">EN</a>
        <a class="toolbar-link" href="#" data-help>开通帮助</a>
      </div>

      <div class="panel-card portal">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">开通学生账号</h2>
            <p class="panel-desc">填写信息后完成学生身份开通。</p>
          </div>
          <div class="role-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4H19v15H7.5A2.5 2.5 0 0 0 5 21V6.5Z"/></svg>
            学生身份
          </div>
        </div>

        <div class="role-switch">
          <a class="role-switch-link" href="/teacher/register.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 7.5 12 4l8 3.5L12 11 4 7.5Z"/></svg>
            教师开通
          </a>
          <a class="role-switch-link active" href="/student/register.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4H19v15H7.5A2.5 2.5 0 0 0 5 21V6.5Z"/></svg>
            学生开通
          </a>
        </div>

        <div id="authMessage" class="msg" role="status" aria-live="polite"></div>
        <div id="sessionNote" class="session-note">
          <div id="sessionText"></div>
          <div class="session-actions">
            <a id="logoutHere" class="link" href="#">退出当前账号</a>
          </div>
        </div>

        <div class="panel-body">
          <form id="authForm" class="auth-form" novalidate>
            <div class="field-group">
              <div class="field">
                <label for="username">账号</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
                  <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" />
                </div>
              </div>
              <div class="field">
                <label for="password">密码</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3"/></svg>
                  <input id="password" name="password" type="password" autocomplete="new-password" placeholder="至少 6 位" />
                </div>
              </div>
            </div>

            <div class="field">
              <label for="confirmPassword">确认密码</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="m7 12 3 3 7-7"/><path d="M12 3l7 4v5c0 5-3.4 8.2-7 9-3.6-.8-7-4-7-9V7l7-4Z"/></svg>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码" />
              </div>
            </div>

            <div class="form-meta">
              <span class="meta-text">开通后自动进入学生主页。</span>
              <a class="link" href="/student/login.html">已有账号，直接登录</a>
            </div>

            <button id="submitBtn" type="submit" class="btn primary">开通学生账号</button>
          </form>

          <div class="support-bar">
            <div class="support-copy">如需其他身份，请切换对应入口。</div>
            <div class="support-actions">
              <a class="toolbar-link" href="/register.html">返回开通中心</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/help-modal.js?v=20260925a" data-help-modal="1"></script>
  <script src="/app.js?v=20261104c"></script>
  <script src="/auth-pages.js?v=20261011a"></script>
  <script src="/auth-hero.js?v=20260919w"></script>
  <script>
    window.AuthPages.initRegister({
      role: 'student',
      submitText: '开通学生账号',
      loadingText: '提交中...',
      successText: '开通成功，正在进入学生主页...'
    });
  </script>
</body>
</html>
