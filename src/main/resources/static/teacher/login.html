<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教师入口登录</title>
  <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/brand-icon.jpg" />
  <link rel="stylesheet" href="/auth-pages.css?v=20261017brand" />
  <link rel="stylesheet" href="/auth-hero.css?v=20261017brand" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="hero-panel">
      <div>
        <div class="hero-deco" aria-hidden="true">
          <i class="hero-orb orb-a"></i>
          <i class="hero-orb orb-b"></i>
          <i class="hero-orb orb-c"></i>
          <i class="hero-dots"></i>
          <i class="hero-glow"></i>
        </div>
        <div class="hero-header">
          <div class="hero-brand">
            <div class="hero-logo" aria-hidden="true"><img src="/brand-icon.jpg" alt="" /></div>
            <div class="hero-brand-copy">
              <strong>智课共生</strong>
            </div>
          </div>
          <div class="hero-status">教师入口</div>
        </div>

        <div class="hero-copy">
          <h1 aria-label="进入智课共生，教师入口。">
            <span class="line" aria-hidden="true"><span class="ch">进</span><span class="ch">入</span><span class="ch">智</span><span class="ch">课</span><span class="ch">共</span><span class="ch">生</span><span class="ch">，</span></span>
            <span class="line grad" style="--n:5" aria-hidden="true"><span class="ch gc" style="--i:0">教</span><span class="ch gc" style="--i:1">师</span><span class="ch gc" style="--i:2">入</span><span class="ch gc" style="--i:3">口</span><span class="ch gc" style="--i:4">。</span></span>
          </h1>
          <p>教师侧认证入口，一次登录进入备课与课堂空间。</p>
          <div class="hero-stats" aria-label="教师空间概览">
            <div class="stat"><strong>备课</strong><span>课件与讲稿</span></div>
            <i class="divider" aria-hidden="true"></i>
            <div class="stat"><strong>成课</strong><span>智课生成</span></div>
            <i class="divider" aria-hidden="true"></i>
            <div class="stat"><strong>学情</strong><span>课堂回看</span></div>
          </div>
        </div>
      </div>

      <div class="hero-meta">
        <div class="hero-list">
          <div class="hero-item">
            <div class="hero-item-icon" aria-hidden="true"><img src="/brand-icon.jpg" alt="" /></div>
            <div>
              <strong>内容管理</strong>
              <span>面向教师侧内容与项目管理。</span>
            </div>
          </div>
          <div class="hero-item">
            <div class="hero-item-icon" aria-hidden="true"><img src="/brand-icon.jpg" alt="" /></div>
            <div>
              <strong>工作台入口</strong>
              <span>认证后进入教师工作区。</span>
            </div>
          </div>
          <div class="hero-item">
            <div class="hero-item-icon" aria-hidden="true"><img src="/brand-icon.jpg" alt="" /></div>
            <div>
              <strong>学情回看</strong>
              <span>课堂数据与讲课记录同页查看。</span>
            </div>
          </div>
        </div>
        <div class="hero-foot">© 2026 智课共生 · AI 互动智课生成与实时问答系统</div>
      </div>
    </section>

    <section class="panel-zone">
      <div class="panel-toolbar">
        <a class="toolbar-link" href="#" data-lang="zh">中文</a>
        <a class="toolbar-link" href="#" data-lang="en">EN</a>
        <a class="toolbar-link" href="#" data-help>帮助中心</a>
      </div>

      <div class="panel-card portal">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">教师登录</h2>
            <p class="panel-desc">使用教师账号完成认证。</p>
          </div>
          <div class="role-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
              <path d="M4 7.5 12 4l8 3.5L12 11 4 7.5Z"/>
            </svg>
            教师入口
          </div>
        </div>

        <div class="role-switch">
          <a class="role-switch-link active" href="/teacher/login.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 7.5 12 4l8 3.5L12 11 4 7.5Z"/></svg>
            教师
          </a>
          <a class="role-switch-link" href="/student/login.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4H19v15H7.5A2.5 2.5 0 0 0 5 21V6.5Z"/></svg>
            学生
          </a>
          <a class="role-switch-link" href="/admin/login">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 3l7 4v5c0 5-3.4 8.2-7 9-3.6-.8-7-4-7-9V7l7-4Z"/></svg>
            管理员
          </a>
        </div>

        <div id="authMessage" class="msg" role="status" aria-live="polite"></div>
        <div id="sessionNote" class="session-note">
          <div id="sessionText"></div>
          <div class="session-actions">
            <a id="returnHomeLink" class="link" href="/workspace.html">返回当前首页</a>
            <a id="logoutHere" class="link" href="#">退出当前账号</a>
          </div>
        </div>

        <div class="panel-body">
          <form id="authForm" class="auth-form" novalidate>
            <div class="field-group">
              <div class="field">
                <label for="username">账号</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
                  <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" />
                </div>
              </div>
              <div class="field">
                <label for="password">密码</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3"/></svg>
                  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
                </div>
              </div>
            </div>

            <div class="form-meta">
              <span class="meta-text">支持企业统一身份接入。</span>
              <a class="link" href="#" data-help>忘记密码</a>
            </div>

            <button id="submitBtn" type="submit" class="btn primary">登录教师入口</button>
          </form>

          <div class="sso-section">
            <div class="sso-head">
              <strong>企业快捷登录</strong>
              <span>入口已预留，待与企业身份源完成联调</span>
            </div>
            <div class="sso-grid">
              <button class="sso-btn" type="button" data-feedback="企业微信登录正在接入。">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M7 9.5c0-2.8 2.6-5 5.8-5s5.7 2.2 5.7 5-2.6 5-5.7 5c-.5 0-1 0-1.5-.2L8 16l.7-2.1A4.6 4.6 0 0 1 7 9.5Z"/></svg>
                企业微信
              </button>
              <button class="sso-btn" type="button" data-feedback="钉钉登录正在接入。">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M10 5h7l-3 6h4l-8 8 2-6H8l2-8Z"/></svg>
                钉钉
              </button>
              <button class="sso-btn" type="button" data-feedback="飞书登录正在接入。">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M7 8.5c0-2 1.7-3.5 3.8-3.5H17v6.3c0 1.5-1.3 2.7-2.8 2.7H9.8C8.2 14 7 12.8 7 11.3V8.5Z"/><path d="M17 11v4.2c0 2-1.7 3.8-3.9 3.8H7v-5.6"/></svg>
                飞书
              </button>
            </div>
          </div>

          <div class="support-bar">
            <div class="support-copy">未开通教师账号可前往开通中心。</div>
            <div class="support-actions">
              <a class="toolbar-link" href="/teacher/register.html">开通教师账号</a>
              <a class="toolbar-link" href="/login.html">返回认证中心</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/help-modal.js?v=20260925a" data-help-modal="1"></script>
  <script src="/app.js"></script>
  <script src="/auth-pages.js"></script>
  <script src="/auth-hero.js?v=20260919w"></script>
  <script>
    window.AuthPages.initLogin({
      role: 'teacher',
      submitText: '登录教师入口',
      loadingText: '登录中...',
      successText: '登录成功，正在进入教师工作区...'
    });
  </script>
</body>
</html>
